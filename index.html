<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>RevenGram - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="img">
        <h1 class="logo-name">R</h1>
      </div>
      <h1>RevenGram</h1>
      <p class="subtitle">تواصل، شارك، استمتع، وحقق المزيد</p>
    </div>
    <div class="glass-card">
      <h2>مرحباً بعودتك 👋</h2>
      <p class="desc">سجل دخولك لإكمال التجربة</p>
      <form id="loginForm">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@mail.com" required>
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <a href="#" class="forgot">نسيت كلمة المرور؟</a>
        <button type="submit" class="login-btn">تسجيل الدخول</button>
      </form>
      <p class="signup">
        ليس لديك حساب؟ <a href="#">سجل الآن</a>
      </p>
    </div>
  </div>
</body>
</html>
